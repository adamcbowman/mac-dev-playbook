---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: true
configure_osx: false

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
  - 'App Store'
  - Calendar
  - Contacts
  - FaceTime
  - FreeForm
  - Freeform
  - Mail
  - Maps
  - Messages
  - Music
  - News
  - Photos
  - Podcasts
  - Reminders
  - TV
  - Warp
dockitems_persist:
  - name: "Firefox"
    path: "/Applications/Firefox.app/"
    pos: 1
  - name: "Ghostty"
    path: "/Applications/Ghostty.app/"
    pos: 2
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app/"
    pos: 3
  - name: "Obsidian"
    path: "/Applications/Obsidian.app/"
    pos: 4
  - name: "Slack"
    path: "/Applications/Slack.app/"
    pos: 5
  - name: "Claude"
    path: "/Applications/Claude.app/"
    pos: 6

configure_sudoers: false
sudoers_custom_config: ''

dotfiles_repo: https://github.com/adamcbowman/dotfiles.git
dotfiles_repo_version: dgi-macbook
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Documents/gitrepos/dotfiles
dotfiles_files:
  - .zshrc
  - .zshenv
  - .zprofile
  - .gitconfig
  - .tmux.conf
  - .aliases
  - .sshrc
  - .sshrc.d
  - .vimrc
  - .config/ghostty
  - .config/nvim
  - .config/starship.toml
  - .config/sketchybar
  - .config/tmux
  - .config/k9s
  - .config/lazygit
  - .aerospace.toml

homebrew_installed_packages:
  # Core
  - git
  - gh
  - node
  - nvm
  - go
  - wget
  - jq
  - yq
  - nmap
  - ssh-copy-id
  - speedtest-cli
  # Shell
  - zoxide
  - fzf
  - eza
  - starship
  - tmux
  - sshrc
  - viddy
  # Kubernetes
  - awscli
  - kubernetes-cli
  - kubernetes-helm
  - helm
  - kubectx
  - k9s
  - eksctl
  - argocd
  - stern
  - kubecolor
  # Dev tools
  - neovim
  - lazygit
  - delta
  - ripgrep
  - fd
  # Infrastructure
  - openconnect
  - pam-reattach
  - ykman
  # Extras
  - lolcat
  - cowsay
  - btop
  - yazi
  - helm-diff

homebrew_taps:
  - homebrew/cask-fonts

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  # Fonts
  - font-jetbrains-mono-nerd-font
  - font-hack-nerd-font
  - font-sketchybar-app-font
  # Terminal / Dev
  - ghostty
  - visual-studio-code
  - docker
  # Browsers
  - firefox
  - google-chrome
  # Productivity
  - obsidian
  - claude
  - 1password
  - 1password-cli
  # Work
  - slack
  - spotify
  # Mac utilities
  - aerospace
  - sketchybar
  - borders
  - lunar
  - tunnelblick
  - aws-vpn-client
  # Misc
  - raspberry-pi-imager

# App Store apps - requires being signed into App Store
# mas list to find app IDs
mas_installed_apps:
  - { id: 937984704, name: "Amphetamine" }
  - { id: 506189836, name: "Harvest" }
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

composer_packages: []
gem_packages: []

npm_packages: []

pip_packages: []

# Sublime Text disabled - using nvim
configure_sublime: false
sublime_base_path: '~/Library/Application Support/Sublime Text'
sublime_config_path: "Packages/User"
sublime_package_control: []

post_provision_tasks: []
